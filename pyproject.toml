[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotfl"
version = "1.0.0"
description = "Federated (distributed) learning of robot joint controllers using Flower"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.22.0",
    "numpy",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["robotfl"]

[tool.flwr.app]
publisher = "ankur"

[tool.flwr.app.components]
serverapp = "robotfl.server_app:app"
clientapp = "robotfl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 30
local-epochs = 5
lr = 0.01


